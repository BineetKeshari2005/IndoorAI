[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indoorai"
version = "0.1.0"
description = "Multimodal AI-powered indoor localization and spatial mapping platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "IndoorAI Research & Engineering Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core foundational dependencies
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
# Traditional Machine Learning & Baseline Tracking
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "mlflow>=2.11.0",
    "joblib>=1.3.2",
    "shap>=0.45.0",
]

# Deep Learning & Neural Architectures
dl = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torcheval>=0.0.7",
]

# Computer Vision & Image Processing
vision = [
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
    "albumentations>=1.4.0",
    "ultralytics>=8.1.0",
]

# Backend API & Database
backend = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

# Visualizations & Exploratory Notebooks
visualization = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "jupyterlab>=4.1.0",
    "ipywidgets>=8.1.0",
]

# Development, Quality, and Testing
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]

# Full bundle for all modules
all = [
    "indoorai[ml,dl,vision,backend,visualization,dev]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

