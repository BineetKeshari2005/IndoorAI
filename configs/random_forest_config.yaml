# ==============================================================================
# IndoorAI - Random Forest Baseline Models Configuration (Task 07)
# ==============================================================================

experiment:
  name: "random_forest_baseline"
  seed: 42
  experiment_dir: "experiments/random_forest"
  models_dir: "experiments/random_forest/models"
  predictions_dir: "experiments/random_forest/predictions"
  metrics_dir: "experiments/random_forest/metrics"
  plots_dir: "experiments/random_forest/plots"
  reports_dir: "experiments/random_forest/reports"
  configs_dir: "experiments/random_forest/configs"

data:
  processed_dir: "data/processed/ujiindoorloc"
  variant_a:
    name: "variant_a_basic"
    train_features: "data/processed/ujiindoorloc/X_train.parquet"
    val_features: "data/processed/ujiindoorloc/X_validation.parquet"
    feature_count: 1040
    description: "520 RSSI features + 520 binary AP visibility features"
  variant_b:
    name: "variant_b_engineered"
    train_features: "data/processed/ujiindoorloc/feature_engineered/X_train_engineered.parquet"
    val_features: "data/processed/ujiindoorloc/feature_engineered/X_validation_engineered.parquet"
    feature_count: 1058
    description: "520 RSSI features + 520 binary AP visibility features + 18 signal summary statistics"
  targets:
    train: "data/processed/ujiindoorloc/y_train.parquet"
    val: "data/processed/ujiindoorloc/y_validation.parquet"
  metadata:
    train: "data/processed/ujiindoorloc/metadata_train.parquet"
    val: "data/processed/ujiindoorloc/metadata_validation.parquet"
  encoders: "experiments/preprocessing/artifacts/target_encoders.json"

cross_validation:
  strategy: "StratifiedGroupKFold"
  n_splits: 5
  group_column: "USERID"
  stratify_column: "BUILDING_FLOOR_INDEX"
  shuffle: true
  random_state: 42

models:
  classifier:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1
  regressor:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1

